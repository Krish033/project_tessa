

on:

    push:
        branches: [main]

    pull_request:
        branches: [main]
    


jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install UV
              uses: astral-sh/setup-uv@v6

            - name: Setup Python
              run: uv python install 3.12

            - name: Install dependencies
              run: uv sync --locked

            - name: Run tests
              run: uv run pytest

