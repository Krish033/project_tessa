[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub[cli]>=1.25.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "faster-whisper>=1.2.1",
    "ollama>=0.4.0",
    "piper-tts>=1.6.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg2-binary>=2.9.12",
    "tokenizers>=0.22.0,<=0.23.0",
    "rich>=15.0.0",
    "pgvector>=0.5.0",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
